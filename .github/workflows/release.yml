name: release

# 发布身份是 annotated tag，不是分支 HEAD。
# dev → main（--ff-only）→ git tag -a vX.Y.Z → push tag，这里才会跑。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff 要完整历史来算 tag 范围

      - name: 校验 tag
        run: |
          tag="$GITHUB_REF_NAME"

          # tag 对象不可移动；分支 HEAD 会，所以发布身份只能是 tag
          test "$(git cat-file -t "$tag")" = "tag" || {
            echo "::error::$tag 不是 annotated tag，用 git tag -a 创建"; exit 1; }

          # 发布的提交必须已经在 main 上（main 是发布分支）
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$tag 指向的提交不在 main 上"; exit 1; }

          # app 进仓后，tag 必须与 pubspec 版本一致：Flutter 构建读的是 pubspec
          if [ -f app/pubspec.yaml ]; then
            declared="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -1)"
            declared="${declared%%+*}"
            test "${tag#v}" = "$declared" || {
              echo "::error::tag $tag 与 app/pubspec.yaml 的 $declared 不一致"; exit 1; }
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # 只用本地 git 历史，不调 GitHub API：本地 `git cliff --latest` 就是这里的结果
      - name: 生成 release notes
        run: git cliff --config cliff.toml --latest --strip header --output RELEASE_NOTES.md

      - name: Rust 工具链
        if: hashFiles('Cargo.toml') != ''
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly-2026-02-28

      - name: Rust 编译缓存
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2

      # 服务端二进制（node / relay）。app 的桌面与移动端打包等 app/ 进仓后再加。
      - name: 构建服务端二进制
        if: hashFiles('Cargo.toml') != ''
        run: |
          cargo build --release -p synap-node -p synap-relay
          tar -C target/release -czf "synap-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            synap-node synap-relay

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: synap-*.tar.gz
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
