name: ci

on:
  push:
    branches: [dev, main]
    # 纯文档提交不跑构建
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [dev, main]
    # 标题也是发布内容：改了标题要重新校验
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR 标题 = squash 后的提交标题 = release note 的一行，所以在这里挡住不合规的
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 标题
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|refactor|perf|docs|test|build|ci|chore'
          if ! [[ "$TITLE" =~ ^($types)(\([a-z0-9._-]+\))?!?:\ .+ ]]; then
            echo "::error::PR 标题必须形如 feat(store): 短句，收到：$TITLE"
            exit 1
          fi
          # 代码类提交的 scope 只能是模块词表里的名字（见 CONTRIBUTING）
          if [[ "$TITLE" =~ ^(feat|fix|refactor|perf|build|ci)\(([a-z0-9._-]+)\) ]]; then
            scope="${BASH_REMATCH[2]}"
            case ",core,store,runtime,node,relay,http,sync,bridge,app,repo,ci,deps," in
              *",$scope,"*) ;;
              *) echo "::error::scope '$scope' 不在词表里"; exit 1 ;;
            esac
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # crates/ 与 app/ 目前还在 .gitignore 里，下面的步骤按文件存在与否自动跳过。
      # 代码进仓后这里自然生效，不需要再改 workflow。

      - name: Rust 工具链
        if: hashFiles('Cargo.toml') != ''
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # 与 justfile 的 RUSTUP_TOOLCHAIN 保持同值
          toolchain: nightly-2026-02-28
          components: rustfmt, clippy

      - name: Rust 编译缓存
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check

      - name: cargo clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --all-targets

      - name: Flutter
        if: hashFiles('app/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          # 固定 SDK：新 stable 已把 package:flutter/material.dart 标记弃用，
          # 版本漂移会直接让 analyze 失败。升级 SDK 时同步改 .fvmrc。
          flutter-version: 3.44.0
          cache: true

      # 只跑 analyze：flutter test 会触发 native assets，构建 crates/synap-bridge，
      # 而 bridge 还停在旧的 Runtime/MemKv API 上。bridge 迁到 Engine/Volume 后把
      # flutter test 加回来。
      - name: flutter analyze
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
