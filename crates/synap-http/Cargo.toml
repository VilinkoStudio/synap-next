[package]
name = "synap-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8" }
rmcp = { version = "3.12.0", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
schemars = "1.2.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-util = "0.7"
