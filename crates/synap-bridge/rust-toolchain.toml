# 与 justfile 的 RUSTUP_TOOLCHAIN 同源，保持一致。
# FRB native-assets 后端要求：固定工具链，不用浮动 channel。
# channel 选用本机已装的 dated nightly，避免每次进目录触发下载。
[toolchain]
channel = "nightly-2026-02-28"
# 只列本机已装的 target；Apple/Windows target 由对应平台的机器或 CI 补装。
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "i686-linux-android",
]
