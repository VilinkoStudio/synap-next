[workspace]
members = ["crates/*"]
# FFI 给客户端用。当前先做 node，不让它进工作区编译。
exclude = ["crates/synap-bridge"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"


[workspace.dependencies]
blake3 = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
postcard = { version = "1", features = ["alloc"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
uuid = { version = "1", features = ["v7"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
# 帧压缩。纯 Rust Zstd，级别 -7..=4。不要换成带 C 的 zstd crate。
zrip = "0.8"
redb = "5"
synap-core = { path = "crates/synap-core" }
synap-store = { path = "crates/synap-store" }
synap-runtime = { path = "crates/synap-runtime" }
