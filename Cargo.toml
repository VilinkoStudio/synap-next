[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

# 单一 pin 入口：旧仓 coreffi 0.31 + coreffi-uniffi029 0.29 双锁不再出现。
# UniFFI 第一版不引；要加时只加这里一个版本。
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
redb = "5"
flutter_rust_bridge = "2"
synap-core = { path = "crates/synap-core" }
synap-store = { path = "crates/synap-store" }
synap-runtime = { path = "crates/synap-runtime" }
